services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blhs-graph-chatbot-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  neo4j:
    image: neo4j:5.22.0-community
    container_name: blhs-neo4j-full-upgrade
    profiles:
      - local-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123456
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - ./neo4j_import:/var/lib/neo4j/import
      - ./cypher:/cypher
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
